name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # README.md and scripts/release.sh both require Xcode 26. macOS 14 is the
    # deployment target — what the app runs on — not the SDK it is built with.
    # An older image builds with an older SDK, where UserNotifications types are
    # not yet Sendable, and fails on strict concurrency the shipping toolchain
    # accepts.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The app icons and docs images are Git LFS objects. checkout does not
          # fetch them by default, and without this the asset-catalog compiler
          # would consume 132-byte pointer files as artwork.
          lfs: true
      - name: Record the toolchain
        run: |
          # The build requirement is documented; prove which toolchain ran.
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install build tools
        run: brew install bats-core xcodegen shellcheck
      - name: Validate release shell
        run: |
          shellcheck scripts/release.sh
          bats tests/release.bats
      - name: Generate project
        run: xcodegen generate
      - name: Test FathomKit
        run: swift test
      - name: Build arm64 applications
        run: |
          xcodebuild -quiet -project Fathom.xcodeproj -scheme Fathom \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -quiet -project Fathom.xcodeproj -scheme FathomBar \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify shipped privacy usage descriptions
        run: |
          # A TCC-gated read without its usage string terminates the process at
          # runtime, which no build or unit test can catch.
          plist=build-dd/Build/Products/Release/FATHOM.app/Contents/Info.plist
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationUsageDescription' "$plist"
      - name: Verify body-text contrast
        run: |
          # Reads the colour worlds, the scrim and the text alpha from source,
          # so it measures what the app renders rather than a restated copy.
          python3 scripts/check-contrast.py
      - name: Audit forbidden shipping APIs
        run: |
          set -eu
          # grep, not ripgrep: rg is absent from the runner image, so this audit
          # exited "command not found" and had never actually run. These are the
          # product's non-negotiables; the check has to work.
          # Every spelling of "spawn a process" and "delete a file" is listed,
          # not just the polite ones: a violation written as posix_spawn or
          # rmdir used to sail through a gate that only knew Process and
          # removeItem.
          if grep -rnE 'unlink\(|removeItem\(|rmdir\(|Process\(|NSTask|posix_spawn|popen\(|execv|NSAppleScript|NSUserUnixTask|NSUserScriptTask|system_profiler|tmutil|diskutil' \
               --include='*.swift' Fathom FathomKit FathomBar; then
            echo "::error::forbidden shipping API above (nothing is deleted; production reads the API)"
            exit 1
          fi
          # ByteCountFormatStyle spells out zero by default, so a stray
          # `.byteCount(` prints "Zero kB" where a figure belongs -- and it did,
          # at twenty-eight call sites, until someone ran the app and read the
          # Network section. ByteString is the one place that decision lives.
          if grep -rn 'byteCount(' --include='*.swift' Fathom FathomKit FathomBar \
               | grep -v 'FathomKit/System/ByteString.swift'; then
            echo "::error::format bytes through FathomKit's ByteString, not .byteCount directly (it spells out zero)"
            exit 1
          fi
          if ! outbound=$(grep -rlE 'URLSession|URLRequest' \
                 --include='*.swift' Fathom FathomKit FathomBar); then
            echo "::error::no outbound-network file found; expected PublicIPService.swift"
            exit 1
          fi
          count=$(printf '%s\n' "$outbound" | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::one outbound request, ever — found $count files:"
            printf '  %s\n' "$outbound"
            exit 1
          fi
          grep -qE 'cloudflare\.com/cdn-cgi/trace' FathomKit/System/PublicIPService.swift || {
            echo "::error::the public IP endpoint changed"
            exit 1
          }
          echo "audit passed: 0 forbidden APIs, exactly 1 outbound-network file"
